<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>P12 Hybrid Powertrain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-window 16:9 technical drawing (SVG), thin control bar underneath. Single light "paper" theme on purpose. */
:root{
  --paper:#fcfcfa; --ink:#16181c; --ink2:#5d6470; --rule:#d5d8de;
  --fc:#1f5fbf; --batt:#178a4a; --dc:#e07b14; --mot:#cf2f2a;
  --ui:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#stage{flex:1 1 auto;min-height:0;width:100%;height:100%;display:block}
.bar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:8px 10px;border-top:1px solid var(--rule);font-size:13px}
.bar button,.bar select,.bar label.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;padding:5px 11px;cursor:pointer;line-height:1.2}
.bar button:hover,.bar label.btn:hover{background:var(--ink);color:var(--paper)}
.bar button:focus-visible,.bar select:focus-visible,.bar input:focus-visible,.bar label.btn:focus-within{outline:2px solid var(--fc);outline-offset:2px}
.bar input[type=range]{flex:1 1 180px;min-width:0;accent-color:var(--ink)}
.bar .time{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2);min-width:13ch}
.bar .grp{display:flex;gap:6px;align-items:center}
.bar .sp{margin-left:auto}
#rec.on{background:var(--mot);border-color:var(--mot);color:#fff}
#file{position:absolute;width:1px;height:1px;opacity:0}
#modal{position:fixed;inset:0;background:rgba(22,24,28,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal .box{background:var(--paper);border:1.5px solid var(--ink);max-width:min(1100px,100%);max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
#modal img,#modal video{max-width:100%;height:auto;border:1px solid var(--rule)}
#modal p{margin:0;color:var(--ink2);font-size:13px;line-height:1.45}
#modal .row{display:flex;gap:8px;flex-wrap:wrap}
#modal a,#modal button{font:inherit;font-size:13px;color:var(--ink);border:1.5px solid var(--ink);padding:5px 11px;border-radius:3px;background:var(--paper);text-decoration:none;cursor:pointer}
</style>

<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Animated cutaway of the Project 12 fuel cell and battery hybrid powertrain with gauges, formula and FTP-75 power profile">
<style>
  .t{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#16181c}
  .m{font-family:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;fill:#5d6470}
  .fx{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",Times,serif;font-style:italic;fill:#16181c}
  .ln{fill:#fcfcfa;stroke:#16181c;stroke-width:1.8;stroke-linejoin:round}
  .ld{fill:none;stroke:#16181c;stroke-width:.9}
  .fade{transition:opacity .35s ease}
</style>
<defs>
  <pattern id="hInk" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fcfcfa"/><line x1="0" y1="0" x2="0" y2="6" stroke="#16181c" stroke-width=".8"/></pattern>
  <pattern id="hGrey" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fcfcfa"/><line x1="0" y1="0" x2="0" y2="5" stroke="#8a9099" stroke-width=".9"/></pattern>
  <pattern id="hFc" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="7" height="7" fill="#fcfcfa"/><line x1="0" y1="0" x2="0" y2="7" stroke="#1f5fbf" stroke-width="1"/></pattern>
  <pattern id="hLam" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="4" height="4" fill="#fcfcfa"/><line x1="0" y1="0" x2="0" y2="4" stroke="#8a9099" stroke-width=".7"/></pattern>
  <marker id="aInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16181c"/></marker>
  <marker id="aFc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
  <marker id="aMot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf2f2a"/></marker>
  <clipPath id="past"><rect id="pastRect" x="0" y="0" width="0" height="900"/></clipPath>
</defs>
<rect width="1600" height="900" fill="#fcfcfa"/>
<g id="gTop"></g>
<g id="gGauges"></g>
<g id="gWiresBase"></g>
<g id="gParts"></g>
<g id="gWires"></g>
<g id="gCall"></g>
<g id="gChart"></g>
<g id="gFoot"></g>
</svg>

<div class="bar" role="toolbar" aria-label="Animation controls">
  <div class="grp">
    <button id="play" type="button" title="Play / pause (space). Slower / faster: [ and ]">Pause</button>
    <button id="restart" type="button" title="Restart from t = 0">Restart</button>
    <select id="cycle" aria-label="Driving cycle">
      <option value="ftp" selected>FTP-75 (1874 s)</option>
      <option value="hwfet">HWFET (765 s)</option>
      <option value="us06">US06 (600 s)</option>
      <option value="csv" disabled>Custom CSV</option>
    </select>
    <select id="speed" aria-label="Playback speed">
      <option value="1">1×</option>
      <option value="2">2×</option>
      <option value="5">5×</option>
      <option value="10">10×</option>
      <option value="20">20×</option>
      <option value="30" selected>30×</option>
      <option value="60">60×</option>
      <option value="120">120×</option>
    </select>
  </div>
  <input id="scrub" type="range" min="0" max="1874" step="1" value="0" aria-label="Cycle time">
  <span class="time" id="tread">0 / 1874 s</span>
  <div class="grp sp">
    <label class="btn" for="file" title="CSV with two columns: time [s], power [W]">Load profile CSV<input id="file" type="file" accept=".csv,.txt,text/csv,text/plain"></label>
    <button id="png" type="button">Save frame PNG</button>
    <button id="rec" type="button">Record video</button>
  </div>
</div>

<div id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <strong id="mtitle">Export</strong>
    <div id="mbody"></div>
    <p id="mnote"></p>
    <div class="row"><button id="mdl" type="button">Download</button><button id="mclose" type="button">Close</button></div>
  </div>
</div>

/* subscript-aware text: "P_{FC} = V_{FC}" */
function rich(node,str,base){
  while(node.firstChild)node.removeChild(node.firstChild);
  const d=base*0.2; let inSub=false;
  str.split(/(_\{[^}]*\})/).forEach(p=>{
    if(!p)return;
    if(p.startsWith('_{')){el('tspan',{'font-size':base*0.6,dy:d,text:p.slice(2,-1)},node);inSub=true;}
    else{const a={text:p};if(inSub){a.dy=-d;inSub=false;}el('tspan',a,node);}
  });
}
function txt(g,x,y,s,o={}){
  const a={x,y,class:o.cls||'t','font-size':o.size||13,text:s};
  if(o.anchor)a['text-anchor']=o.anchor; if(o.weight)a['font-weight']=o.weight; if(o.fill)a.fill=o.fill; if(o.ls)a['letter-spacing']=o.ls; if(o.id)a.id=o.id;
  return el('text',a,g);
}
function callout(g,pts,lines,anchor){
  anchor=anchor||'start';
  el('circle',{cx:pts[0][0],cy:pts[0][1],r:2.6,fill:C.ink},g);
  el('polyline',{points:pts.map(p=>p.join(',')).join(' '),class:'ld'},g);
  const [x,y]=pts[pts.length-1], dx=anchor==='end'?-5:5;
  lines.forEach((s,i)=>txt(g,x+dx,y+4+i*17,s,{cls:i?'m':'t',size:i?12.5:15,weight:i?400:600,anchor}));
}

// speed -> traction power with a generic small-car road-load model, used only to shape the trace before scaling to 1 kW peak
function speedToPower(mph){
  const v=mph.map(x=>x*1.609344/3.6),T=v.length-1;
  return normalise(v.map((ms,s)=>{const a=(v[Math.min(T,s+1)]-v[Math.max(0,s-1)])/2;return 1200*a*ms+0.012*1200*9.81*ms+0.5*1.2*0.65*ms*ms*ms;}));
}
function normalise(p){const mx=Math.max(...p);return p.map(x=>clamp(x*P.mot.Ppeak/mx,-P.mot.Pregen,P.mot.Ppeak));}

/* ===== Simulation (1 s step) ===== */
function simulate(pd){
  const o={pd:[],pmel:[],pfc:[],pdc:[],pb:[],ib:[],vb:[],soc:[],w:[]};
  let lpf=0,pfc=P.ems.Pmin,soc=P.batt.SOC0,w=0;
  const {E0,R,Q}=P.batt;
  for(const d of pd){
    const pmel=d>=0?d/P.mot.eta:d*P.mot.eta;
    lpf+=(Math.max(pmel,0)-lpf)/P.ems.tau;
    const tgt=clamp(lpf/P.dc.eta+P.ems.kSoc*(P.batt.SOC0-soc),P.ems.Pmin,P.fc.Pmax);
    pfc+=clamp(tgt-pfc,-P.ems.rate,P.ems.rate);
    const pdc=P.dc.eta*pfc, pb=pmel-pdc;
    const ib=(E0-Math.sqrt(Math.max(E0*E0-4*R*pb,0)))/(2*R), vb=E0-ib*R;
    o.pd.push(d);o.pmel.push(pmel);o.pfc.push(pfc);o.pdc.push(pdc);o.pb.push(pb);o.ib.push(ib);o.vb.push(vb);o.soc.push(soc);o.w.push(w);
    soc-=ib/(Q*3600)*100; w+=(Math.abs(d)-w)/4;
  }
  return o;
}

}

function render(t,dt){

  gSOC.set(s.soc,`${s.soc.toFixed(1)} %`,`I_batt ${s.ib>=0?'+':'−'}${Math.abs(s.ib).toFixed(1)} A`);

  flow(W.fc,s.pfc,dt);flow(W.dc,s.pdc,dt);flow(W.m1,s.pmel,dt);flow(W.m2,s.pd,dt);flow(W.b,-s.pb,dt);

  lab.b.textContent=`${sg(s.pb)} kW ${s.pb>8?'▲ discharge':s.pb<-8?'▼ charge':''}`;
  // FC stack glow, H2, water

  h2ph=(h2ph+dt*(10+70*lf))%43;h2dots.forEach((d,i)=>d.setAttribute('cx',(302+((h2ph+i*10.75)%43)).toFixed(1)));

  // motor

  const rg=s.pd<-10;regen.setAttribute('opacity',rg?1:.18);regenT.setAttribute('opacity',rg?1:.18);
  if(rg)regen.setAttribute('stroke-dashoffset',(-(performance.now()/40)%9).toFixed(1));

  const x=cx(t);$('pastRect').setAttribute('width',x.toFixed(1));

  runDot.setAttribute('cx',x);runDot.setAttribute('cy',cy(s.pd));runDotFc.setAttribute('cx',x);runDotFc.setAttribute('cy',cy(s.pfc));
  const bx=clamp(x,CX0+38,CX1-38);runBox.setAttribute('x',bx-38);runLab.setAttribute('x',bx);runLab.textContent=`t = ${Math.round(t)} s`;

  const rows=(await f.text()).split(/\r?\n/).map(l=>l.trim().split(/[,;\t ]+/).map(Number)).filter(r=>r.length&&r.every(Number.isFinite));
  let tp;
  if(rows.length&&rows[0].length>=2)tp=rows.map(r=>[r[0],r[1]]);else tp=rows.map((r,i)=>[i,r[0]]);
  if(tp.length<10){showModal('Profile not loaded',null,`“${f.name}” has fewer than 10 numeric rows. Use two columns: time in s, power in W (a header row is fine).`);return;}
  tp.sort((a,b)=>a[0]-b[0]);const t0=tp[0][0],Tn=Math.floor(tp[tp.length-1][0]-t0),p=[];let j=0;
  for(let s=0;s<=Tn;s++){while(j<tp.length-2&&tp[j+1][0]-t0<s)j++;const [a,pa]=tp[j],[b,pb]=tp[j+1];p.push(b>a?pa+(pb-pa)*clamp((s+t0-a)/(b-a),0,1):pb);}
  const o=$('cycle').querySelector('option[value=csv]');o.disabled=false;o.textContent='CSV: '+f.name;$('cycle').value='csv';
  csvPd=normalise(p);csvName=f.name;setProfile(csvPd,csvName,false,'custom');e.target.value='';
};
function setProfile(pd,name,phases,key){
  SIM=simulate(pd);T=SIM.pd.length-1;profileName=name;showPhases=phases;cycleKey=key;
  $('scrub').max=T;tSim=0;fxIdx=0;fxTimer=0;buildChart();speedLabels();
}
let csvPd=null,csvName='';
$('cycle').onchange=e=>{const k=e.target.value;
  if(k==='csv'){if(csvPd)setProfile(csvPd,csvName,false,'custom');return;}
  const c=CYCLES[k];setProfile(speedToPower(c.mph()),c.name,!!c.phases,k);};

/* ===== Export: PNG frame + video ===== */
async function drawSvg(ctx,W2,H2){
  const s=new XMLSerializer().serializeToString(svg);
  const url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  await new Promise((ok,bad)=>{img.onload=ok;img.onerror=bad;img.src=url;});
  ctx.fillStyle=C.paper;ctx.fillRect(0,0,W2,H2);ctx.drawImage(img,0,0,W2,H2);URL.revokeObjectURL(url);
}
let mBlob=null,mName='';
async function saveFile(blob,name){
  if(window.claude&&window.claude.use){
    let d=null;try{d=await window.claude.use('downloads');}catch(_){}
    if(d){try{await d.save({filename:name,data:blob});return 'Saved '+name+'.';}
      catch(e){return e&&e.code==='declined'?'Download cancelled. Use Download to try again.':'This view cannot save files. Right-click the preview and choose “Save as…”.';}}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  return 'Downloading '+name+'. If nothing happens, right-click the preview and choose “Save as…”.';
}
function showModal(title,node,note,blob,name){
  $('mtitle').textContent=title;const b=$('mbody');b.replaceChildren();if(node)b.appendChild(node);
  $('mnote').textContent=note||'';mBlob=blob||null;mName=name||'';$('mdl').hidden=!blob;
  $('modal').hidden=false;
  if(blob)saveFile(blob,name).then(m=>{$('mnote').textContent=m;});
}
$('mdl').onclick=()=>{if(mBlob)saveFile(mBlob,mName).then(m=>{$('mnote').textContent=m;});};
$('mclose').onclick=()=>{$('modal').hidden=true;};
$('png').onclick=async()=>{
  const cv=document.createElement('canvas');cv.width=3200;cv.height=1800;
  try{await drawSvg(cv.getContext('2d'),3200,1800);}catch(err){showModal('Export failed',null,'The browser could not rasterise the drawing.');return;}
  cv.toBlob(bl=>{const u=URL.createObjectURL(bl),img=new Image();img.src=u;img.alt='Exported frame';
    const name=`P12_powertrain_t${Math.round(tSim)}s.png`;
    showModal('Frame exported as PNG (3200 × 1800)',img,'',bl,name);
  },'image/png');
};
let rec=null,recCv,recCtx,recBusy=false,recChunks=[],recWasSpeed;
function pickMime(){const c=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];return c.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';}
$('rec').onclick=()=>{
  if(rec){stopRec();return;}
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){showModal('Recording not available',null,'This browser has no MediaRecorder. Use a current Chrome, Edge, Firefox or Safari.');return;}
  recCv=document.createElement('canvas');recCv.width=1920;recCv.height=1080;recCtx=recCv.getContext('2d');
  const mime=pickMime();
  try{rec=new MediaRecorder(recCv.captureStream(30),mime?{mimeType:mime,videoBitsPerSecond:8e6}:{});}catch(err){rec=null;showModal('Recording failed',null,String(err));return;}
  recChunks=[];rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data);};
  rec.onstop=()=>{
    const type=rec.mimeType||mime||'video/webm',ext=type.includes('mp4')?'mp4':'webm',bl=new Blob(recChunks,{type}),u=URL.createObjectURL(bl);
    const v=document.createElement('video');v.src=u;v.controls=true;v.playsInline=true;
    showModal(`Video recorded (${ext.toUpperCase()}, 1920 × 1080)`,v,'',bl,`P12_powertrain_${cycleKey}.${ext}`);
    rec=null;$('rec').classList.remove('on');$('rec').textContent='Record video';
  };
  tSim=0;fxIdx=0;fxTimer=0;setPlaying(true);rec.start(500);$('rec').classList.add('on');
};
function recFrame(){
  $('rec').textContent=`Stop ● ${Math.round(100*tSim/T)} %`;
  if(tSim>=T){stopRec();return;}
  if(recBusy)return;recBusy=true;
  drawSvg(recCtx,1920,1080).catch(()=>{}).finally(()=>{recBusy=false;});
}
function stopRec(){if(rec&&rec.state==='recording')rec.stop();}

requestAnimationFrame(frame);
})();
